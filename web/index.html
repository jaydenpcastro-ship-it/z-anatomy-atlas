<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-Anatomy Atlas</title>
<meta name="description" content="Interactive 3D human anatomy atlas: navigate skeletal, muscular, cardiovascular, nervous, visceral and lymphoid systems, joints and body regions.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/motion.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Toggle navigation" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <h1>Z-Anatomy <span>Atlas</span></h1>
    <div class="spacer"></div>
    <div class="views" role="group" aria-label="Camera views">
      <button data-view="front">Front</button>
      <button data-view="back">Back</button>
      <button data-view="left">Left</button>
      <button data-view="right">Right</button>
      <button data-view="fit">Fit</button>
    </div>
    <button id="studyBtn" class="mode-btn" type="button" aria-pressed="false" title="Diagram quizzes for every section">Study</button>
    <label class="lang"><span class="sr">Language</span>
      <select id="lang" title="Structure names">
        <option value="en">English</option><option value="la">Latin</option><option value="fr">Français</option>
        <option value="es">Español</option><option value="pt">Português</option>
      </select>
    </label>
  </header>

  <nav id="sidebar" aria-label="Anatomy navigation">
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search structures, e.g. scapula, aorta…  ( / )" autocomplete="off" spellcheck="false">
    </div>
    <div class="filters">
      <select id="fSystem" aria-label="Body system filter"></select>
      <select id="fJoint" aria-label="Joint type filter"></select>
      <select id="fCart" aria-label="Cartilage filter"></select>
      <label class="check"><input id="fLandmarks" type="checkbox" checked> Landmarks</label>
      <button id="clearFilters" class="link" hidden>Clear filters</button>
    </div>
    <div id="results" hidden></div>
    <div id="browse">
      <h2>Body systems</h2>
      <ul id="systems"></ul>
    </div>
  </nav>

  <main id="stage">
    <canvas id="gl" tabindex="0" aria-label="3D anatomy viewer"></canvas>
    <div id="overlay" aria-hidden="true"></div>
    <div id="tip" role="status" hidden></div>
    <div id="loading" hidden><div class="bar"><i></i></div><span></span></div>
    <div id="hint">Drag to rotate · scroll to zoom · right-drag to pan · click a structure</div>
    <div class="toolbar">
      <button id="ghostBtn" aria-pressed="false" title="Fade everything except the selection (G)">Ghost others</button>
      <button id="isoBtn" aria-pressed="false" title="Show only the selection (I)">Isolate</button>
      <button id="pinsBtn" aria-pressed="false" title="Show landmark pins">Landmarks</button>
      <button id="clearBtn" title="Clear selection (Esc)">Clear</button>
    </div>
  </main>

  <aside id="info" aria-live="polite"></aside>
  <section id="study" aria-label="Study tools" hidden></section>
</div>
<template id="info-empty">
  <div class="empty">
    <h2>Select a structure</h2>
    <p>Pick a body system on the left, browse its groups, or search. Click any structure in the 3D view to read about it.</p>
    <p class="fine">Model: Z-Anatomy, derived from BodyParts3D (© The Database Center for Life Science, CC BY-SA 2.1 JP). Descriptions from Wikipedia (CC BY-SA). Shared under the same licence.</p>
  </div>
</template>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/quiz.js"></script>
<script type="module" src="js/motion.js"></script>
</body>
</html>
